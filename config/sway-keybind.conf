# Add this to your ~/.config/sway/config (adjust the path to your clone)

# mumble streaming mode - SUPER+D to toggle (live transcription)
bindsym $mod+d exec ~/projects/mumble/mumble stream

# mumble recording mode - SUPER+Shift+D to toggle (press-to-talk)
bindsym $mod+Shift+d exec ~/projects/mumble/mumble toggle
