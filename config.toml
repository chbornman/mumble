# Whisper Daemon Configuration
# All paths support ~ for home directory expansion and environment variables

[paths]
# whisper.cpp installation directory
whisper_cpp_dir = "~/projects/whisper.cpp"

# Directory containing .bin model files (relative to whisper_cpp_dir if not absolute)
models_dir = "models"

# whisper.cpp build output directory (relative to whisper_cpp_dir if not absolute)
build_dir = "build/bin"

# Project directory (auto-detected, override if needed)
# project_dir = "~/projects/mumble"

# Vocabulary file for domain-specific terms (relative to project dir)
vocab_file = "vocab.txt"

# Sound files directory (relative to project dir)
sound_dir = "sounds"

[model]
# Active model name (without ggml- prefix and .bin suffix)
# Available: tiny.en, base.en, small.en, medium.en, large-v3, large-v3-turbo
# Quantized variants: base.en-q5_1, base.en-q8_0, small.en-q5_1, etc.
name = "large-v3-turbo"

# Language (use "en" for English-only models, "auto" for multilingual)
language = "en"

[backend]
# Inference backend: "cpu" or "vulkan"
# "cpu" uses whisper.cpp compiled with GGML_CPU (default, always works)
# "vulkan" uses whisper.cpp compiled with GGML_VULKAN (requires Vulkan-capable GPU)
type = "vulkan"

# Number of threads for inference
# 0 = auto-detect (uses cpu_count, capped at max_threads)
# Recommended: 8 for most systems, 4-6 for efficiency cores
threads = 0

# Maximum threads when auto-detecting (prevents over-subscription)
max_threads = 12

# Number of processors for parallel inference (whisper-server only)
# Keep at 1 unless you need concurrent transcriptions
processors = 1

# Enable flash attention (faster on supported hardware)
flash_attention = false

# Streaming engine selector — which backend handles live streaming dictation
# (the STREAM verb / toggle_stream.sh keybind). This is SEPARATE from `type`
# above, which selects the batch press-to-talk inference backend and is
# untouched.
#   "whisper-stream"     = legacy whisper.cpp rolling-buffer pipeline + stream_dedup.py.
#                          Now daemon-owned (spawned by the daemon, not the shell
#                          script) but behaviorally identical to before.
#   "nemotron-streaming" = daemon-owned client to the mumble-stt sidecar, a
#                          long-lived NeMo/Nemotron process holding the model
#                          resident and emitting clean, punctuated FINAL segments
#                          over a unix socket (see [nemotron] below).
streaming_backend = "whisper-stream"

[backend.cpu]
# CPU-specific settings (used when backend.type = "cpu")
# These are passed to whisper.cpp cmake build

# Use native CPU instructions (-march=native)
native = true

# Enable OpenMP threading
openmp = true

# Enable link-time optimization (slower build, ~5-10% faster inference)
lto = true

# Enable weight repacking for better cache usage
repack = true

# Enable BLAS acceleration (requires OpenBLAS installed)
# May help on some CPUs, benchmark to verify
blas = false

[backend.vulkan]
# Vulkan-specific settings (used when backend.type = "vulkan")

# GPU device index (0 = first GPU, 1 = second GPU, etc.)
device = 1

# Allow fallback to CPU if Vulkan initialization fails
cpu_fallback = true

[audio]
# Audio capture sample rate in Hz (whisper requires 16000)
sample_rate = 16000

# Number of audio channels (whisper requires 1 = mono)
channels = 1

# Sound playback sample rate for feedback sounds (Hz)
sound_sample_rate = 44100

# Hard cap on a single recording's length, in seconds. The capture buffer is
# held in memory and concatenated on stop, so an un-stopped recording (missed
# toggle / dropped IPC) grows without bound and the kernel OOM-kills the daemon.
# On hitting the cap, recording auto-stops and transcribes what it captured.
# 1200s = 20 min (~38 MB int16) is generous for real dictation. 0 disables.
max_recording_seconds = 1200

[daemon]
# Daemon operation mode: "cli" or "server"
# "cli" loads model per transcription (lower memory, slower per-request)
# "server" keeps model in memory via whisper-server (higher memory, faster)
mode = "cli"

# Unix socket path for IPC
socket_path = "/tmp/whisper_daemon.sock"

# Recording state flag file
recording_flag = "/tmp/whisper_recording"

# Streaming state flag file
streaming_flag = "/tmp/whisper_streaming"

# Log file path
log_file = "/tmp/whisper_daemon.log"

# Enable desktop notifications (disable when using waybar)
notifications = false

# Whisper-server HTTP port (server mode only)
server_port = 8080

# Maximum wait time for whisper-server startup (seconds)
server_startup_timeout = 30

# Server health check interval during startup (seconds)
server_health_check_interval = 0.5

[transcription]
# Temperature for transcription (0.0 = greedy/deterministic)
temperature = 0.0

# Temperature increment for fallback retries
temperature_increment = 0.2

# CLI mode timeout per transcription (seconds)
cli_timeout = 300

# Server mode request timeout (seconds)
server_timeout = 30

# Strip leading artifacts from transcriptions (e.g., "--", "- ")
strip_leading_artifacts = true

# Patterns to strip from start of transcription (regex list)
strip_patterns = [
    "^--\\s*",
    "^-\\s+",
]

# Response format for server mode
response_format = "json"

[streaming]
# Streaming mode settings (whisper-stream binary)

# Audio step size in ms (0 = wait for speech via VAD)
step = 0

# Audio buffer length in ms
buffer_length = 30000

# Buffer overlap for continuity (ms)
keep = 200

# Voice Activity Detection threshold (0.0-1.0)
# Higher = less sensitive (waits for clearer speech)
# Lower = more sensitive (triggers on quieter sounds)
vad_threshold = 0.6

# Number of threads for streaming (separate from daemon threads)
threads = 8

# Maximum committed text length before trimming (characters)
max_committed_length = 500

# Minimum character overlap to consider a match
min_overlap_chars = 20

# Overlap search step size (characters to skip per iteration)
overlap_step = 10

# Suffix search length for fallback matching (characters)
fallback_suffix_length = 50

# Consecutive fallback count before drift reset
drift_reset_threshold = 2

# Maximum length for last-sentence fallback (characters)
max_fallback_sentence_length = 100

# Noise filter regex (lines matching this are filtered out)
noise_filter_pattern = "^\\s*(\\(.*\\)|\\[.*\\]|\\*.*\\*)\\s*$"

# Stream deduplicator selection. `true` uses the legacy character-overlap
# StreamDeduplicator (default — preserves existing behavior). `false`
# switches to WordLevelDeduplicator: word-level diff + immediate-repeat
# suppression, designed to fix the mid-phrase-pause dupe.
legacy_dedup = true

# Word-level dedup tuning (only consumed when legacy_dedup = false).
# `word_overlap_lookback` — max suffix-word length searched for overlap.
# `immediate_repeat_window` — words of committed tail checked for repeat
# suppression. Defaults tuned against technical.txt calibration.
word_overlap_lookback = 15
immediate_repeat_window = 8
max_committed_words = 200

[streaming.debug]
# Debug log file for streaming deduplication
log_file = "/tmp/whisper_stream_debug.log"

# Raw whisper-stream output log
output_log = "/tmp/whisper_stream_output.log"

# whisper-stream stderr log
stream_log = "/tmp/whisper_stream.log"

[nemotron]
# Settings for the "nemotron-streaming" streaming backend (see
# backend.streaming_backend above). These are ignored unless
# backend.streaming_backend = "nemotron-streaming". The heavy NeMo model can't
# share mumble's light venv, so it runs as a separate long-lived process
# (mumble-stt, its own venv / mumble-stt.service) and the daemon talks to it as
# a client over a unix socket.

# Unix socket the daemon connects to to reach the mumble-stt sidecar. Must match
# the sidecar's bind path. `%t` expands to $XDG_RUNTIME_DIR (the systemd unit
# convention), so this default matches what the sidecar binds out of the box —
# no per-machine tweak needed. Override here or in config.local.toml if you move it.
socket_path = "%t/mumble-stt.sock"

# If true, the daemon Popens the sidecar itself on the first STREAM when the
# socket is absent. If false (recommended), it assumes the sidecar is already
# running (e.g. mumble-stt.service) and only connects.
sidecar_autostart = false

# Explicit launch command for the sidecar when sidecar_autostart = true.
# Empty string = use the installer's default launch command. Only consumed when
# sidecar_autostart = true.
sidecar_cmd = ""

# How long to wait (seconds) for the sidecar socket to become connectable after
# a STREAM start before giving up (and falling back if legacy_fallback = true).
connect_timeout = 5.0

# How streamed text is injected — the finals-vs-true-streaming switch:
#   "finals" = type each FINAL segment when the model commits it (at an
#              end-of-utterance pause). Clean and safe; text lands phrase by
#              phrase. Tune the pause length with [mumble_stt] eou_silence_ms.
#   "live"   = type the growing PARTIAL hypothesis as you speak, backspacing and
#              correcting the tail when the model revises it (it needs a little
#              lookahead, so the last word or two lags — expected). Closest to a
#              real-time teleprompter feel. Requires a text injector that can
#              synthesize Backspace (wtype/xdotool/ydotool all can).
inject_mode = "finals"

# If the sidecar can't be reached on STREAM start (socket missing/refused, no
# READY within connect_timeout), fall back to the legacy whisper-stream pipeline
# instead of hard-failing — flipping streaming_backend to "nemotron-streaming"
# stays low-risk because a dead sidecar degrades to a working keybind.
legacy_fallback = true

[mumble_stt]
# The Nemotron streaming sidecar (the heavy NeMo process). The daemon and the
# sidecar read this SAME file — these keys configure the sidecar. Changes here
# need `systemctl --user restart mumble-stt.service` to take effect (the daemon
# restart is separate). Only consumed when streaming_backend = "nemotron-streaming".

# Hugging Face model id loaded resident on the GPU.
model = "nvidia/nemotron-speech-streaming-en-0.6b"

# Audio sample rate (Hz). The model is 16 kHz; don't change unless you know why.
sample_rate = 16000

# Latency/accuracy profile for the cache-aware encoder. "default" = the model's
# lowest-latency window ([70, 1], ~160 ms native chunk). An explicit "L,R" form
# (e.g. "70,13") trades latency for a little more right-context accuracy.
att_context = "default"

# End-of-utterance silence in milliseconds: how long you pause before the model
# commits a FINAL segment. Lower = snappier, more frequent finals (more
# fragmented); higher = waits for cleaner sentence breaks. This is the main
# "snappiness" knob for finals mode.
eou_silence_ms = 800

# Sidecar log verbosity: "debug" | "info" | "warning" | "error".
log_level = "info"

# Python interpreter of the DEDICATED heavy venv (NeMo + torch -- see
# mumble_stt/requirements.txt for setup). Defaults to <repo>/.venv-stt/bin/python.
# If yours lives elsewhere, set it here AND update mumble-stt.service's ExecStart.
# venv_python = "/path/to/.venv-stt/bin/python"

# socket_path is intentionally omitted: the sidecar defaults to
# %t/mumble-stt.sock ($XDG_RUNTIME_DIR), which the daemon's [nemotron] socket_path
# default already matches. Set it in both places only if you relocate the socket.

[wayland]
# Wayland display (for wtype and notifications)
# "auto" tries to detect from environment
display = "wayland-1"

# XDG runtime directory
# "auto" uses /run/user/<uid>
xdg_runtime_dir = "auto"

# Text injector — how transcribed text is typed into the focused window.
# Pluggable backend (see text_injector.py):
#   "wtype"    Wayland (default)
#   "ydotool"  Wayland or X11 (uinput; needs ydotoold running)
#   "xdotool"  X11
#   "auto"     pick from $XDG_SESSION_TYPE + what's installed
# Any other value is treated as a raw command that receives the text on stdin.
typer = "wtype"

# Clipboard-paste threshold (characters). When the transcribed text is
# longer than this, mumble copies via `wl-copy`, synthesizes Ctrl+V via
# wtype, and restores the previous clipboard — `wtype` gets flaky on
# long inputs. 0 disables the clipboard path entirely (always use typer).
clipboard_paste_threshold = 500

# Clipboard tooling (Wayland). Only consumed when
# clipboard_paste_threshold > 0.
wl_copy = "wl-copy"
wl_paste = "wl-paste"

# Notification tool
notifier = "notify-send"

# Notification timeout (ms)
notification_timeout = 2000

[waybar]
# Waybar module update interval (seconds)
update_interval = 0.5

# Icons for different states
[waybar.icons]
cli_ready = "~"
cli_recording = "● dictation"
cli_processing = "dictation"
server_ready = "◆"
server_recording = "◆ dictation"
server_processing = "dictation"
streaming = "~ streaming"
error = "~"

[build]
# whisper.cpp build configuration
# Used by install.sh and rebuild commands

# CMake build type
build_type = "Release"

# Build whisper-server
build_server = true

# Build with SDL2 support (required for streaming mode)
build_sdl2 = true

[llm_postprocess]
# Optional local-LLM cleanup pass after Whisper transcription (CLI mode only).
# Removes fillers, resolves self-corrections, restores punctuation, applies
# glossary corrections. Streaming + LLM is out of scope — combined pipeline
# latency is too high.
#
# Off by default. Enable only after pointing `endpoint` at a running LLM
# server. Any HTTP failure falls back to the raw Whisper transcript.
#
# Off until you have an endpoint to point it at (a resident llama-server /
# Ollama instance — `toggle_llm.sh` shows the load/unload pattern). See
# ARCHITECTURE.md §"LLM cleanup".
enabled = false

# Backend hint ("llama.cpp", "ollama", "lmstudio", "vllm"). Informational only;
# all backends are called via the OpenAI-compatible /v1/chat/completions API.
backend = "llama.cpp"

# OpenAI-compatible chat-completions endpoint.
# llama.cpp server default:  http://127.0.0.1:8090/v1/chat/completions
# Ollama (OpenAI shim):      http://127.0.0.1:11434/v1/chat/completions
# LM Studio default:         http://127.0.0.1:1234/v1/chat/completions
endpoint = "http://127.0.0.1:19999/v1/chat/completions"

# Model name as the server knows it. Using Nemotron Nano-4B for ultra-fast cleanup.
# nvidia/NVIDIA-Nemotron-3-Nano-4B-GGUF:Q4_K_M (~3.5GB, Mamba hybrid)
model = "NVIDIA-Nemotron-3-Nano-4B"

# Cap on generated tokens. 2048 covers ~2600 words of cleanup output,
# comfortable for multi-minute theorizing-out-loud recordings.
max_tokens = 2048

# Greedy decoding. Cleanup is a constrained-edit task; sampling adds drift.
temperature = 0.0

# HTTP request timeout (seconds). Expected latency on a 5080 is 0.3-1.5s
# for short inputs; long cleanups (2000+ tokens) can take several seconds.
timeout = 30

# JSONL audit log — one row per turn:
#   {timestamp, audio_file, raw_transcript, prompt, context, mode,
#    cleaned_output, raw_llm_output, model, latency_ms, error}
# Required for prompt tuning. Set to "" to disable.
audit_log = "/tmp/mumble_postprocess.jsonl"

# Optional path to a file whose contents replace the built-in base system
# prompt. Empty = use built-in (FreeFlow-pattern cleanup prompt).
prompt_template_path = ""

[llm_postprocess.command_mode]
# Voice command mode: transforms the currently-selected text according to
# a spoken instruction. Depends on llm_postprocess.enabled = true.
#
# Suggested Hyprland bind:
#   bind = SUPER CTRL, D, exec, mumble command
# which sends `COMMAND` to the daemon IPC socket.
enabled = false

# Selections are captured with `wl-paste -p` (primary) by default; set to
# "clipboard" to use the regular clipboard instead (requires the user to
# Ctrl+C first). "primary" matches Wayland's mouse-select convention.
selection_source = "primary"

# Temperature for command-mode transforms. Higher than cleanup (0.0)
# because command mode is explicitly transformative (rewrite, translate,
# summarize).
temperature = 0.2

[llm_postprocess.app_context]
# Per-app context injection (Hyprland-only, optional).
# Shells to `hyprctl activewindow -j`, appends the focused window's class
# and title to the LLM prompt as untrusted metadata (wording lifted from
# Tambourine's DictationContextManager). Gracefully degrades when
# HYPRLAND_INSTANCE_SIGNATURE is unset.
enabled = false

# Max window title chars kept in the prompt (bounds growth on pathological
# browser tabs or editor titles).
max_title_chars = 200

# Optional per-app style/mode overrides, keyed by Hyprland window class.
# When the focused class matches, the `style` is appended to the cleanup
# prompt; the `mode` selects a preset transform (see item #3).
#
# [llm_postprocess.apps.Alacritty]
# style = "terse; user is in a terminal; no extra punctuation"
#
# [llm_postprocess.apps.thunderbird]
# style = "formal email prose; full sentences"
# mode = "email"
